[pytest]
testpaths = tests filetrack
python_files = test_*.py
python_functions = test_*
norecursedirs = .git __pycache__ data incoming processed error

# Readable console output by default (one line per test, short tracebacks,
# colored output when terminal supports it, summary of skips/xfails at end).
addopts = -v --tb=short -ra --color=yes

markers =
    gh21: Epic #21 EPIC Data import & client matching (Drake + manual log)
    gh22: #22 DoD Drake CSV imports without breaking
    gh23: #23 DoD Manual Excel log imports without breaking
    gh24: #24 DoD High-confidence client matching
    gh25: #25 DoD Low-confidence matches in Review Queue
    gh26: #26 DoD No duplicate returns (client + tax year)
    gh27: #27 DoD Log numbers assigned and visible
    gh28: #28 DoD Imported data usable in real workflow

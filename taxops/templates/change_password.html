<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password — Tax Log</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tw.min.css') }}?v={{ config.APP_VERSION }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ config.APP_VERSION }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="h-full bg-slate-50 flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">

      <div class="text-center">
        <h1 class="text-xl font-bold text-slate-900">Set Your Password</h1>
        <p class="text-sm text-slate-500 mt-1">
          Your account has a temporary password. Please set a new one before continuing.
        </p>
      </div>

      {% if error %}
      <div class="rounded-lg px-4 py-2.5 text-sm font-medium bg-red-50 text-red-800 border border-red-200">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('change_password') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
          <label for="new_password" class="block text-xs font-semibold text-slate-600 mb-1">New password</label>
          <input id="new_password" name="new_password" type="password" required autocomplete="new-password"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <p class="text-xs text-slate-400 mt-1">Minimum 8 characters.</p>
        </div>

        <div>
          <label for="confirm_password" class="block text-xs font-semibold text-slate-600 mb-1">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <button type="submit"
                class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors">
          Set password and continue
        </button>
      </form>

      <p class="text-center">
        <a href="{{ url_for('logout') }}" class="text-xs text-slate-400 hover:text-slate-600">Sign out</a>
      </p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Now Serving — Take a Number</title>
  <style>
    :root {
      --cabernet: #6B2233;
      --cabernet-hover: #54192A;
      --cabernet-light: #F3E5E8;
      --ink: #1e1a1b;
      --muted: #6b5f62;
      --card: #ffffff;
      --page: #f7f1f2;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    * { box-sizing: border-box; }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      max-width: 56rem;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--cabernet);
      letter-spacing: 0.02em;
    }
    .lang-btn, .take-btn, .dismiss-btn {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    .lang-btn {
      min-height: 56px;
      min-width: 56px;
      padding: 0 1rem;
      border-radius: 999px;
      background: var(--cabernet-light);
      color: var(--cabernet);
      font-size: 1rem;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
    }
    .take-btn {
      width: min(100%, 28rem);
      min-height: 7rem;
      border-radius: 1.25rem;
      background: var(--cabernet);
      color: #fff;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      box-shadow: 0 10px 28px rgba(107, 34, 51, 0.28);
    }
    .take-btn:active { background: var(--cabernet-hover); }
    .take-btn:disabled { opacity: 0.55; }
    .hint { color: var(--muted); font-size: 1.05rem; margin: 0; }
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .board-card {
      background: var(--card);
      border: 1px solid #e5d6da;
      border-radius: 1rem;
      padding: 1rem 0.75rem;
      text-align: center;
    }
    .board-card .win-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .board-card .serving {
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 800;
      color: var(--cabernet);
      margin-top: 0.35rem;
      font-variant-numeric: tabular-nums;
    }
    .stub {
      position: fixed;
      inset: 0;
      background: rgba(30, 26, 27, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 20;
    }
    .stub.open { display: flex; }
    .stub-card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 1.75rem 1.5rem;
      width: min(100%, 26rem);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .stub-num {
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 900;
      color: var(--cabernet);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stub-meta { margin-top: 0.75rem; font-size: 1.15rem; color: var(--ink); }
    .stub-meta strong { color: var(--cabernet); }
    .dismiss-btn {
      margin-top: 1.5rem;
      width: 100%;
      min-height: 56px;
      border-radius: 0.85rem;
      background: var(--cabernet);
      color: #fff;
      font-size: 1.1rem;
    }
    .status-line {
      min-height: 1.25rem;
      color: #b91c1c;
      font-size: 0.95rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 data-i18n="title">Now Serving</h1>
      <button type="button" class="lang-btn" id="lang-btn" aria-label="Language">ES</button>
    </header>

    <div class="hero">
      <button type="button" class="take-btn" id="take-btn" data-i18n="take">Take a Number</button>
      <p class="hint" data-i18n="hint">Tap once. Keep your ticket until you are called.</p>
      <p class="status-line" id="err" hidden></p>
    </div>

    <div class="boards" aria-live="polite">
      <div class="board-card">
        <div class="win-label"><span data-i18n="window">Window</span> 1</div>
        <div class="serving" id="serve-1">—</div>
        <div class="win-label" style="margin-top:0.35rem" data-i18n="now">Now Serving</div>
      </div>
      <div class="board-card">
        <div class="win-label"><span data-i18n="window">Window</span> 2</div>
        <div class="serving" id="serve-2">—</div>
        <div class="win-label" style="margin-top:0.35rem" data-i18n="now">Now Serving</div>
      </div>
    </div>
  </div>

  <div class="stub" id="stub" role="dialog" aria-modal="true">
    <div class="stub-card">
      <div class="stub-num" id="stub-num">—</div>
      <p class="stub-meta" id="stub-meta"></p>
      <button type="button" class="dismiss-btn" id="stub-dismiss" data-i18n="done">Done</button>
    </div>
  </div>

  <script>
  (function () {
    var STR = {
      en: {
        title: "Now Serving",
        take: "Take a Number",
        hint: "Tap once. Keep your ticket until you are called.",
        window: "Window",
        now: "Now Serving",
        done: "Done",
        ahead: "People ahead",
        assigned: "Go to Window",
        busy: "Please wait…",
        err: "Could not issue a ticket. Try again."
      },
      es_MX: {
        title: "Ahora Atendiendo",
        take: "Tomar un Número",
        hint: "Toque una vez. Conserve su boleto hasta que lo llamen.",
        window: "Ventanilla",
        now: "Ahora Atendiendo",
        done: "Listo",
        ahead: "Personas adelante",
        assigned: "Vaya a la Ventanilla",
        busy: "Espere…",
        err: "No se pudo emitir boleto. Intente de nuevo."
      }
    };
    var LOCALE_KEY = "taxops-now-serving-locale";
    var locale = localStorage.getItem(LOCALE_KEY) === "es_MX" ? "es_MX" : "en";
    var takeBtn = document.getElementById("take-btn");
    var langBtn = document.getElementById("lang-btn");
    var errEl = document.getElementById("err");
    var stub = document.getElementById("stub");
    var csrf = (document.querySelector('meta[name="csrf-token"]') || {}).content || "";
    var busy = false;

    function t(key) { return (STR[locale] || STR.en)[key] || key; }

    function applyI18n() {
      document.documentElement.lang = locale === "es_MX" ? "es" : "en";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      langBtn.textContent = locale === "es_MX" ? "EN" : "ES";
    }

    function paintServing(snap) {
      var ns = (snap && snap.now_serving) || {};
      document.getElementById("serve-1").textContent = ns["1"] || "—";
      document.getElementById("serve-2").textContent = ns["2"] || "—";
    }

    function showStub(ticket) {
      document.getElementById("stub-num").textContent = ticket.label;
      document.getElementById("stub-meta").innerHTML =
        t("assigned") + " <strong>" + ticket.window + "</strong><br>" +
        t("ahead") + ": <strong>" + (ticket.people_ahead != null ? ticket.people_ahead : "—") + "</strong>";
      stub.classList.add("open");
    }

    langBtn.addEventListener("click", function () {
      locale = locale === "es_MX" ? "en" : "es_MX";
      try { localStorage.setItem(LOCALE_KEY, locale); } catch (e) {}
      applyI18n();
    });

    document.getElementById("stub-dismiss").addEventListener("click", function () {
      stub.classList.remove("open");
    });

    takeBtn.addEventListener("click", function () {
      if (busy) return;
      busy = true;
      takeBtn.disabled = true;
      takeBtn.textContent = t("busy");
      errEl.hidden = true;
      fetch("/now-serving/kiosk/take", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrf
        },
        body: "{}",
        credentials: "same-origin"
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok || !res.d.success) throw new Error((res.d && res.d.error) || t("err"));
          paintServing({ now_serving: res.d.now_serving });
          showStub(res.d);
        })
        .catch(function () {
          errEl.hidden = false;
          errEl.textContent = t("err");
        })
        .finally(function () {
          busy = false;
          takeBtn.disabled = false;
          takeBtn.textContent = t("take");
        });
    });

    // Live board: SSE with polling fallback (no EventSource memory leak — one connection).
    var es = null;
    function startLive() {
      if (es) { try { es.close(); } catch (e) {} es = null; }
      if (!window.EventSource) {
        setInterval(function () {
          fetch("/now-serving/api/snapshot", { credentials: "same-origin" })
            .then(function (r) { return r.json(); })
            .then(paintServing)
            .catch(function () {});
        }, 1000);
        return;
      }
      es = new EventSource("/now-serving/api/events");
      es.onmessage = function (ev) {
        try { paintServing(JSON.parse(ev.data)); } catch (e) {}
      };
      es.onerror = function () {
        // Browser will reconnect; also soft-poll once.
        fetch("/now-serving/api/snapshot", { credentials: "same-origin" })
          .then(function (r) { return r.json(); })
          .then(paintServing)
          .catch(function () {});
      };
    }

    applyI18n();
    paintServing({{ initial_snapshot | tojson }});
    startLive();
  })();
  </script>
</body>
</html>
